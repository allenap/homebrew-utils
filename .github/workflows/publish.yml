name: brew pr-pull

on:
  # The normal path, and also the manual one: publish the bottles built for a
  # given PR, push them to ghcr, commit the updated `bottle do` block, and merge.
  # The `brew test-bot` workflow dispatches this itself once it has built bottles
  # for a `bump-*` branch, so a release needs no label and no manual step; supply
  # the number by hand to recover a bump whose bottles were built but never
  # pulled.
  #
  # A `workflow_run` trigger used to serve the automatic path, but it never fires
  # for these PRs: `livecheck` opens them with the default GITHUB_TOKEN, and
  # events raised by that token do not start new workflow runs. That guard is why
  # the earlier `labeled` approach needed a PAT, and it defeats `workflow_run`
  # just the same. `workflow_dispatch` is one of its two documented exceptions,
  # so dispatching is what actually works — with no credential to expire.
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to pull bottles from
        required: true

  # Legacy/manual escape hatch: still honour a `pr-pull` label on a PR.
  pull_request_target:
    types:
      - labeled

jobs:
  pr-pull:
    # Run for a dispatch, or a PR explicitly labelled `pr-pull`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       contains(github.event.pull_request.labels.*.name, 'pr-pull'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Determine PR number and branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pull_request }}
          PR_TARGET_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) number="$DISPATCH_PR" ;;
            pull_request_target) number="$PR_TARGET_NUMBER" ;;
          esac
          if [ -z "${number:-}" ]; then
            echo "Could not determine a PR number; nothing to do." >&2
            exit 1
          fi
          # Look the branch up now, while the PR is still open: `brew pr-pull`
          # closes it, and the delete step below needs the name.
          branch="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
            --json headRefName --jq .headRefName)"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          PULL_REQUEST: ${{ steps.pr.outputs.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ github.token }}
          branch: master

      # Only `bump-*` branches are ours to tidy away. Dispatch is now the normal
      # path rather than a fallback, so this can no longer skip on that event,
      # but it must not delete a branch someone is working on if a dispatch is
      # aimed at an arbitrary PR.
      - name: Delete branch
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            bump-*) git push --delete origin "$BRANCH" || true ;;
            *) echo "$BRANCH is not a bump-* branch; leaving it alone." ;;
          esac
