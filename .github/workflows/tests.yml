name: brew test-bot

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae --root-url='https://ghcr.io/v2/allenap/utils'
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  # Ask `brew pr-pull` to publish the bottles this run just built.
  #
  # This is a `workflow_dispatch` on purpose. Events raised by the default
  # GITHUB_TOKEN do not start new workflow runs — GitHub's guard against
  # recursion — and `workflow_dispatch` and `repository_dispatch` are its only
  # exceptions. The bump PRs are opened by the `livecheck` workflow using that
  # same token, so everything downstream of them is suppressed, `workflow_run`
  # included. Dispatching explicitly steps outside the guard, and needs no PAT
  # to do it.
  dispatch-pr-pull:
    name: Publish bottles
    needs: test-bot
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump-')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch `brew pr-pull`
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --field pull_request="$PULL_REQUEST"
